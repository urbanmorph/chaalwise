# Plain-language checks on learner-facing text: `pnpm lint:prose`. Rules are in tools/vale/styles/Chaalwise.
StylesPath = tools/vale/styles
MinAlertLevel = warning

[*.md]
BasedOnStyles = Chaalwise, Vale
Vale.Spelling = NO
Vale.Terms = NO
Vale.Avoid = NO

# Question files: only the text a learner reads.
[*.yaml]
View = Question
BasedOnStyles = Chaalwise, Vale
Vale.Spelling = NO
Vale.Terms = NO
Vale.Avoid = NO

name: Puzzle pipeline

# Manual only: builds the puzzle chunks from the Lichess puzzle database and uploads them to R2.
# Nothing here runs on a schedule or on push.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Keep everything on the runner (no R2 upload)
        type: boolean
        default: true
      time_limit:
        description: Stop cleanly after this long (progress is kept in R2; run again to continue)
        type: string
        default: 5h

permissions:
  contents: read

concurrency:
  group: puzzles
  cancel-in-progress: false

jobs:
  puzzles:
    name: Build puzzle chunks
    runs-on: ubuntu-latest
    # Above the tool's own time limit, so it always stops by itself and saves its progress first.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: zstd --version
      - name: Run the pipeline
        working-directory: tools/puzzles
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            node src/cli.ts --dry-run --time-limit "$TIME_LIMIT"
          else
            # Upload only with the UrbanMorph R2 credentials, all four set explicitly.
            test -n "$R2_ACCOUNT_ID" -a -n "$R2_ACCESS_KEY_ID" -a -n "$R2_SECRET_ACCESS_KEY" -a -n "$R2_BUCKET" \
              || { echo "::error::R2 secrets are not all set"; exit 1; }
            node src/cli.ts --time-limit "$TIME_LIMIT"
          fi
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          TIME_LIMIT: ${{ inputs.time_limit }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: puzzles
          path: |
            tools/puzzles/.cache/out/
            tools/puzzles/.cache/checkpoint.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

from: life/pass-the-problem-back/fourth-project
prompt: You already have three projects due this month. Your manager asks you to fit in a fourth as well.
explanation: 'Hand the hard choice back to the person who can make it: ask your manager which of the four should move. They know the priorities; you know the hours.'
feedback:
  spend-effort-where-it-matters: Where to put your effort is the right worry, but the choice is not yours to make alone.
  make-it-hard: You are not losing a contest. You are being handed a choice that belongs with someone else.
  look-at-three: Listing options helps, but the best move is to ask the person who sets the priorities to pick.

prompt: A new intern in your Kolkata office says nothing in team meetings. A senior colleague calls him unsure of himself and wants to drop him from the client project. The meetings are fast, in English, and full of terms only the team uses. He studied in Bengali.
explanation: Before judging him as unsure, ask what about his situation would make anyone quiet. Fast meetings in his second language, full of team terms, would. Give him the terms, and a chance to speak first.
feedback:
  a-bet-tells-a-story: His silence is not a claim he is making to you. It is a reaction to the meetings, so look at the meetings.
  more-than-one-guess: Several explanations are possible, but the facts given point to one. The habit to use is to look at his situation first.
  basics-before-brilliance: Teaching him the basics may help, but first stop judging him by a silence the meetings could explain.

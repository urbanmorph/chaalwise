from: life/how-long-does-this-deserve/internship-form
prompt: 'A company invites second-year students to apply for a paid summer internship. The form takes 20 minutes, and being turned down costs nothing. You have been thinking about it for a week.'
explanation: A choice with a real upside and no real downside deserves almost no thought. Apply today, and weigh an offer if one comes.
feedback:
  chance-and-price: There is no price to weigh against the chance. Being turned down costs nothing.
  commit-in-stages: Nothing big is being committed. Applying is 20 minutes, and accepting is a separate choice.
  look-at-three: You do not need more options before applying. The week of thinking is the problem.

from: life/find-what-everything-depends-on/one-password
prompt: A small school keeps all its records, fees and timetables in one online system. Only the office manager knows the admin password and how to restore the backups. She is going on a month's leave.
explanation: One person holds everything up. Before she goes, share the password safely and teach a second person to restore the backups.
feedback:
  fix-your-weakest-link: The office manager is not the weak part; she is the strong part everything leans on. That is a different problem.
  finish-the-job: Nothing is nearly finished. The question is what fails if one person is away.
  pass-the-problem-back: There is no hard choice to hand to someone else. The fix is to stop depending on one person.

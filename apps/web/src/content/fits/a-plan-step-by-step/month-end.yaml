from: life/a-plan-step-by-step/month-end
prompt: Your team takes 10 working days to close the accounts each month. You want it down to 5 within six months.
explanation: Turn the goal into a route of small steps, each worth having on its own, such as one day saved, and look again after each.
feedback:
  shrink-the-problem: That is about leaving fewer ways for things to go wrong as you work through a job. Here the need is a route to a goal months away.
  basics-before-brilliance: No basic step is being skipped for a clever one. The need is a route from here to there.
  fix-your-weakest-link: Finding the slowest part may be one of the steps, but the whole goal needs a route of several.

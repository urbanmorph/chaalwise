from: life/a-plan-step-by-step/new-language
prompt: You want to give a 10-minute talk in a new language at a conference in nine months. You can study for 30 minutes a day.
explanation: 'Make a route of small steps, each worth having on its own: words for your topic, then short sentences, then a 1-minute talk. Check your progress after each.'
feedback:
  shrink-the-problem: Nothing here falls apart if you stop halfway. The need is a route to a goal nine months off.
  patterns-save-thinking: Learning common phrases helps, but the bigger need is a plan of steps to the talk.
  spend-effort-where-it-matters: Your time is fixed at 30 minutes a day. The question is how to lay those days out towards the goal.

from: life/what-else-could-this-buy/overtime
prompt: 'Your firm offers you paid overtime this weekend, for ₹4,000. The same weekend is the last chance this year to take a two-day course that would qualify you for a better role.'
explanation: The real cost of a choice is the best thing you give up for it. The overtime looks like pure gain, but it costs the course.
feedback:
  give-a-little-get-more: That is about giving something up on purpose to get more. Here the ₹4,000 looks free, and the cost is hidden.
  spend-effort-where-it-matters: This is not about how long to think. It is about what the weekend could buy instead.
  know-when-to-stop: Nothing has been spent yet. The cost is what the weekend would give up.

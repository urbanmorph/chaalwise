from: life/meet-again/wholesaler
prompt: You run a small catering firm in Pune and have bought vegetables from the same wholesaler for three years. This week, for the first time, they delivered a day late, and buying elsewhere cost you ₹3,000 more.
explanation: After three good years, one slip is worth forgiving. Say clearly what it cost you, and keep the relationship, since you will deal with them again.
feedback:
  review-calmly: Judging one late delivery fairly helps, but the decision is about a long relationship and how to answer a slip in it.
  know-when-to-stop: Nothing here is a lost cause. One late delivery in three years is a slip, not a pattern.
  find-what-everything-depends-on: Relying on one wholesaler is a risk, but the question this week is how to answer one slip from a good partner.

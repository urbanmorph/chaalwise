prompt: On an interview panel in Delhi, you noticed last month that a colleague rated candidates from his own college higher. Today you are about to rate a candidate who went to your old school, and you like her answers.
explanation: Hold yourself to the check you gave him. Rate her against the written criteria first, say that you share a school, and ask a colleague whether your scores are fair.
feedback:
  blame-the-situation-first: You are not judging why someone else acted. The risk here is in your own judgement.
  more-than-one-guess: Nothing is hidden about the candidate. The risk is a pull on your own rating that you cannot feel.
  review-calmly: Review calmly looks back at a decision. The check here comes before you rate.

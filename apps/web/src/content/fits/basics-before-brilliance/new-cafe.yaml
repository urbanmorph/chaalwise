from: life/basics-before-brilliance/new-cafe
prompt: You are opening a small café. A friend suggests a big social media launch with a well-known guest. You have not yet settled your suppliers, prices or opening hours.
explanation: Get the plain, sound steps right first. A clever launch only pays if the café works when people arrive.
feedback:
  two-birds-one-stone: The launch serves one aim, getting people in. The point is that the basics must come before it.
  lead-or-answer: Being first is not the question. The question is what must be ready before anyone comes.
  make-it-hard: Nothing is going wrong yet. You are deciding what to do first.

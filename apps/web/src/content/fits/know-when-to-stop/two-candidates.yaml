prompt: Two members of a college club in Jaipur both want to be its president, and the club says it will not hold a vote while both are standing. Each week both campaign, they lose study time. One of them is about to start, and asks a friend for advice.
explanation: 'In a contest where both sides pay each week, set the most you will spend before it starts, while you are calm, and keep to it.'
feedback:
  their-next-move: Guessing what the rival will do helps, but the first step is your own limit, set before the weeks pile up.
  spend-effort-where-it-matters: This is not about where to put effort in a task. It is when to stop a contest that costs both sides.
  commit-in-stages: There is nothing to try small first. The contest is all or nothing, so the limit matters most.

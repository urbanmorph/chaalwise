from: life/know-when-to-stop/coaching-fees
prompt: You paid ₹45,000, which cannot be refunded, for a year of weekend coaching classes for an entrance exam. Three months in, your mock test scores have not moved, and working through past papers on your own has helped more.
explanation: 'What you have spent is gone either way. Decide on what comes next: your weekends may be better spent on past papers.'
feedback:
  review-calmly: Judging the past choice fairly is useful, but the decision now is about the coming months, not the fee already paid.
  make-it-hard: Keeping on is not fighting back here. The classes are not helping.
  fix-your-weakest-link: No part needs raising. The question is whether to keep giving time to something that does not help.

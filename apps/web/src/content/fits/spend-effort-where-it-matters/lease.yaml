from: life/spend-effort-where-it-matters/lease
prompt: This week you must choose a booking tool for meeting rooms, which can be cancelled any month, and sign a five-year office lease. You have about ten hours for both.
explanation: Decide the small choice you can undo quickly, and spend your effort on the large, final one. The lease gets nearly all ten hours.
feedback:
  look-at-three: Comparing options helps with the lease, but the key is how to split your time.
  fix-your-weakest-link: No part of a process is slow. The question is which of two choices deserves the hours.
  two-birds-one-stone: No single move does both jobs. One choice simply matters far more.

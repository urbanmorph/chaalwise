kind: choice
prompt: A course costs 5,000. In your present job it would earn you about 2,000 more a year. It also qualifies you for a kind of job that pays far more, and you are likely to move to one within two years. How should you judge it?
options:
  - Count the later pay too, as long as you will really make the move
  - 'Only by your present job: 2,000 a year'
  - Never pay for a course that does not pay back at once
  - Take it whatever it costs, because learning always pays
answer: 0
feedback:
  - ''
  - Judging only by today leaves out the larger gain that may come later.
  - Some of the best choices pay back later, not at once.
  - 'The price still matters: count the later gain only if it is likely.'
explanation: In poker, implied odds count the points you may win later in a hand, not only what is on the table now. Do the same here. Count the gains still to come, but only those you can really expect.
measures: weigh-odds

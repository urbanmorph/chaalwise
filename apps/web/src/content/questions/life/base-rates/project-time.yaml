card: reference/strategy/base-rates/project-time
kind: choice
prompt: Your team expects its new software system to take six months to build. Of ten similar projects in your firm, eight took at least 50% longer than planned. What is the best estimate for this one?
options:
  - 'Six months: this team knows its plan'
  - Six months, plus a week or two of slack
  - About nine months, then adjust for real differences
answer: 2
feedback:
  - The plan is the inside view, the team's own picture of its work. Each of those ten teams had a plan too, and most of them still ran over.
  - Some slack feels prudent, but a week or two is far less than similar projects needed. Start from how they went.
  - ''
explanation: 'Start from the outside view, how similar projects really went: most took 50% longer, so six months becomes about nine. Then adjust only for what truly differs, such as a smaller scope.'
measures: weigh-odds

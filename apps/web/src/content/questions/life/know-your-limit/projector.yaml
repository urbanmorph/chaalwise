kind: choice
prompt: Your college society is buying a second-hand projector for its events. A new one costs ₹30,000, and hiring one costs ₹2,000 an event. A seller asks ₹22,000. Before you start talking, what should you decide?
options:
  - The most you will pay, from what a new one or hiring costs
  - The seller's lowest price, so you can aim for it
  - 'Nothing yet: see how the talks go first'
answer: 0
feedback:
  - ''
  - You cannot know the seller's lowest price yet, only guess at it. Your own limit is the one figure you can know before you start.
  - A limit decided in the middle of talks drifts towards the seller's figure. In the Split the pie lab, a bargaining game, a deal below your walk-away point leaves you worse off than no deal.
explanation: 'Your walk-away point comes from your alternatives: a new one at ₹30,000, or hiring at ₹2,000 an event. Work it out first, offer below it, and walk away if the price goes above it.'
measures: value

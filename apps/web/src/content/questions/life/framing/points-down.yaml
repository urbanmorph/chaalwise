card: reference/strategy/framing/points-down
kind: choice
prompt: At a quiz night scored in points, you are 300 points down. In the last round you can take 100 points back for sure, or take a 1 in 3 chance of winning all 300 back, and otherwise nothing. Many people take the chance. What usually pulls them to it?
options:
  - The chance of 300 is worth more on average than 100 for sure
  - Wanting to get back to even makes the long shot look better
  - After a bad run, luck is due to turn
answer: 1
feedback:
  - Both options are worth 100 points on average. The chance is not worth more, only riskier.
  - ''
  - Luck owes you nothing; each chance is the same as before. That feeling is the wish to undo the loss.
explanation: 'Facing a sure loss, people tend to take a risk to avoid it. A chance to get back to even feels worth more than it is (the break-even effect). Ask what you would choose if you were level: the same 100 for sure or a 1 in 3 chance of 300.'
measures: composure

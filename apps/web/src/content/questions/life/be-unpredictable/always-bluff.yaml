card: reference/strategy/be-unpredictable/always-bluff
kind: choice
prompt: In poker, a player bets big only when they have a weak hand. What does a watchful opponent do?
options:
  - Call every big bet
  - Fold to big bets, as most players do
  - Call some big bets, in case the read is wrong
answer: 0
feedback:
  - ''
  - Folding to big bets is sound against most players, because big bets usually mean strength. Against this player they mean the opposite.
  - 'Caution feels safe, but the pattern is complete: every big bet is a bluff. Each fold hands over points you could have won.'
explanation: A pattern that can be read can be used. Once big bets always mean a weak hand, calling them wins far more than folding.
measures: unpredictable

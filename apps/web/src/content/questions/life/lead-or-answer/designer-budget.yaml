kind: choice
prompt: You are hiring a freelance designer for a logo. You have checked, and similar work costs about 15,000. The designer asks what your budget is. What do you do?
options:
  - Name a fair figure near 15,000, with what the job includes
  - Ask them to quote first, so you never pay more than needed
  - Name a very low figure, such as 3,000, to leave room to go up
answer: 0
feedback:
  - ''
  - Answering second pays when their move would tell you something. You already know the going rate, so you gain little and let them set the starting point.
  - An offer far below the going rate tells a good designer you do not know the work, and they may simply walk away.
explanation: Lead or answer well. You know what the work is worth, so moving first lets your figure set the starting point the talk moves around. Answer second when you lack that knowledge and their move would tell you something.
measures: plan-long

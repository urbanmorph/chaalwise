kind: choice
prompt: A small school keeps all its records, fees and timetables in one online system. Only the office manager knows the admin password and how to restore the backups. She is going on a month's leave. What matters most before she goes?
options:
  - Write down how to run and restore it, and share access safely
  - Ask her to keep her phone on in case something breaks
  - Move to a faster system with more features
answer: 0
feedback:
  - ''
  - That still rests everything on one person, now on leave and harder to reach. One lost phone or bad signal and nobody can get in.
  - A new system does not fix the problem. Unless the knowledge is shared, it will rest on one person again.
explanation: Find what everything depends on. Here it is one person's knowledge, not the system. Back it up before it is needed by writing it down and giving a second person safe access.
measures: calculate

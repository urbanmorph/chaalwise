kind: choice
prompt: A client rejected your proposal harshly. On your next bid for work, you are tempted to price it far below cost to make sure you win. What is driving that urge?
options:
  - The loss is deciding, not the numbers
  - Cutting the price is the wise move after a loss
  - You should stop bidding for a year to recover
  - Winning the next bid at any price fixes the loss
answer: 0
feedback:
  - ''
  - A bid priced below cost loses money even when it wins.
  - One rejection is not a reason to stop; it is a reason to stay calm.
  - A bid won at a loss adds a second loss to the first.
explanation: In poker, playing badly after a painful loss is called tilt. The same pull works at work. A painful loss pushes you to win back what you lost. Decide the next bid on its own numbers.
measures: composure

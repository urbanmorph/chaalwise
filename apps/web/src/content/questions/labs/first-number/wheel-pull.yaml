  - 'It did not pull me: I knew the wheel meant nothing'
  - 'It did not pull me: 7,000 is nearer the range than her 8,000, so mine was reasoned'
  - 'It pulled me only if I felt pulled at the time'
answer: 0
feedback:
  - ''
  - 'Your friend knew the wheel meant nothing too. Knowing a number is meaningless does not stop it pulling: that is what the lab shows.'

explanation: "The lab gave 4,000 to 6,000, with 5,000 in the middle. Your 7,000 sits above the range, towards the 9,000 on the wheel, just as your friend's 8,000 did. You saw her pull from outside, by her answer. You judged your own from inside, by how it felt. Judge both by the answer."

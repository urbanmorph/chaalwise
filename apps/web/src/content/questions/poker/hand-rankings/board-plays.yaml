  board: [Ac, Kc, Qd, Js, Th]
  others:
    - name: Computer
      cards: [4h, 5s]
options:
  - 'Neither: both play the straight on the board, and split the pot'
  - You, because your cards are of the same suits as the board
  - The computer, because its cards are higher than yours
  - Whoever bet last
answer: 0
feedback:
  - ''
  - Suits never rank, and your cards add nothing to an ace-high straight.
  - Neither player's own cards improve on the board's straight, so they do not count.

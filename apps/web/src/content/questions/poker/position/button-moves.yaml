kind: choice
prompt: In poker, a marker called the dealer button moves one seat round the table after each hand. Why does it move?
options:
  - So every player takes turns acting last, the best seat
  - To decide who shuffles
  - So the best player always acts last
  - It is decoration
answer: 0
feedback:
  - ''
  - In a home game the player with the button may also deal, but that is not why it moves. It moves so that the best seat goes round.
  - The button rotates whoever is playing.
  - The button decides the order of play.
explanation: Acting last is an advantage, so the button moves round the table and every player gets it in turn.

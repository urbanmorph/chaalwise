kind: choice
prompt: To call (match a bet) costs you 4 points. If you win, you collect 16 points that were already in the pot; you win one time in four. On average, what does each call win or lose?
options:
  - It wins 1 point on average
  - It loses 4 points on average
  - It wins 12 points on average
  - It breaks even
answer: 0
feedback:
  - ''
  - You lose 4 three times in four, but you win 16 the other time.
  - You win 16 only one time in four, and lose 4 the other three.
  - 'Count both sides: one time in four you win 16, three times you lose 4.'
explanation: 'Over four calls you win 16 once and lose 4 three times: 16 − 12 = 4 points over four calls, or 1 point a call. A call that wins only one time in four can still be a good call.'
measures: odds

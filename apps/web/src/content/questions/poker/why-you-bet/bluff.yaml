kind: choice
prompt: 'All five shared cards are out. The hearts you hoped for did not come, and you hold only high card: no pair or better. Your one opponent is careful, and often folds (gives up) to a bet. Which reason could a bet have?'
cards:
  hole: [6h, 5h]
  board: [Ah, Kc, 9h, 3s, Qd]
  pot: 14
options:
  - 'A bluff: a better hand might fold'
  - 'Value: worse hands will call'
  - 'None: never bet a weak hand'
  - To see their cards for free
answer: 0
feedback:
  - ''
  - Almost every hand beats yours, so a call means you lose.
  - A weak hand can win the pot only if the others fold. Checking gives up that chance.
  - 'Seeing cards at the showdown is not free: a call costs the bet.'
explanation: With high card you cannot win at the showdown, but you can win if they fold. Against a careful player a bluff (a bet with a weak hand) sometimes works. Bluff less often than you bet with strong hands, and when your earlier bets make a strong hand believable.
measures: betting

kind: choice
prompt: When are your implied odds small?
options:
  - When your draw is plain to see if it comes
  - When the pot is already large before the call
  - When you have the best hand at the moment
  - When there is only one card still to come
answer: 0
feedback:
  - ''
  - A large pot gives better pot odds now; implied odds are about what comes later.
  - Implied odds are for draws; with the best hand now, you want to be paid now.
  - One card to come still leaves the river betting, so implied odds can be large or small.
explanation: If a fourth heart on the board shows everyone the flush, a sensible opponent stops paying. Implied odds need a hit the other player cannot see.
measures: odds

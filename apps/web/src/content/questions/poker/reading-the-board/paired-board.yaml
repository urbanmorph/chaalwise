kind: choice
prompt: 'You hold the ace and jack of diamonds: a flush (five diamonds), ace high. The last shared card is a second king, so the board now has a pair. What has changed?'
cards:
  hole: [Ad, Jd]
  board: [9d, Kd, 4d, 7c, Ks]
options:
  - A full house is now possible, and it beats your flush
  - 'Nothing: a flush still beats everything possible here'
  - Your flush has become a straight flush
  - You now have a full house, kings full of nines
answer: 0
feedback:
  - ''
  - A pair on the board makes full houses possible, and they beat a flush.

kind: choice
prompt: Each player makes the best five cards from their own two and these five shared cards. What is the best hand anyone could hold here?
cards:
  board: [Ks, Qs, 7s, 4d, 2c]
options:
  - A flush with the ace of spades
  - Three kings, with a pair of kings in the hand
  - A straight, ace to ten
  - Four of a kind, in any rank
answer: 0
feedback:
  - ''
  - Three kings would lose to any flush.
  - 'A straight from ace to ten needs an ace, a jack and a ten from one player: three cards, and each player holds only two.'
  - Four of a kind needs a pair on the board, and there is none.
explanation: Three spades on the board make a flush possible; no straight or full house is. The best flush holds the ace of spades.
measures: hand-reading

kind: choice
prompt: A cautious player who has not raised (bet more than the last bet) all session raises now. What does it most likely tell you?
options:
  - They most likely have a strong hand
  - They are bluffing, to change how they look
  - 'Nothing: every raise means the same thing'
  - They have a weak hand and want you to fold
answer: 0
feedback:
  - ''
  - 'Possible, but rare: a cautious player seldom risks points on a bluff.'
  - The same raise means more from a player who seldom raises.
  - That is a bluff; cautious players bluff least of all.
explanation: A signal that is costly to send falsely is believable. From a cautious player, a raise usually means a strong hand.
measures: signals

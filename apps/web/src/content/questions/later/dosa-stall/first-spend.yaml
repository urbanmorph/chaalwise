kind: choice
prompt: You have ₹15,000 to make the stall faster. Where does it go?
options:
  - A payment QR code, and a second person at the counter at rush hour
  - A second griddle, so the cook can make more dosas
  - Better packing boxes
answer: 0
feedback:

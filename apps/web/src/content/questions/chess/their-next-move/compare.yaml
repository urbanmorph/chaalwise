card: strategy/their-next-move/compare
kind: choice
prompt: In this chess opening, White has just played Qh5. Before replying, Black asks what White wants. What does that share with preparing for the meeting?
position: 'moves: e4 e5 Qh5'
alongside: Next week you will ask your manager for a raise.
options:
  - Work out their best reply before you make your move
  - Hope they react the way you would like
  - Move first so they have no time to think
answer: 0
feedback:
  - ''
  - Hoping is how Nf6 walks into Qxf7 mate. Plan for their best reply, not the one you want.
  - Speed does not remove their reply. Moving without thinking it through only hides it from you.
explanation: 'In both, you think through the other side''s best reply, as they see it, before you commit: Black guards f7, and you prepare the answer to "not this year".'
measures: think-ahead

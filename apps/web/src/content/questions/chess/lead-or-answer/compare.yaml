card: strategy/lead-or-answer/compare
kind: choice
prompt: In this chess opening, White plays 1.e4 and Black answers with c5, rather than copying with e5. What does that share with your reply to the supplier?
position: 'moves: e4 c5'
alongside: A supplier opens a negotiation with a firm price for the year.
options:
  - 'Choose on purpose how to answer: keep it level, or change the terms'
  - Copy what the other side did, to stay even
  - Accept that the first mover keeps the advantage
answer: 0
feedback:
  - ''
  - Copying hands the other side the lead. Black chose c5 to make the game unbalanced, not to mirror it.
  - Moving first gives a small edge, not the result. The answer decides how much it is worth.
explanation: The other side moved first in both. Before replying, you choose whether to keep it level or change the terms, as Black does with c5 and you can with a counter-offer.
measures: plan-long

prompt: In this chess position, Black threatens Qxh2, checkmate. Find a move that stops the mate and also attacks the queen.
position: 5rk1/pp3ppp/2pb4/8/4P2q/2P5/PP1N1PPP/3Q1RK1 w - - 0 1
answers:
  - d2f3
  - g2g3
hint: Which piece could guard h2 and attack the queen at the same time?
explanation: Nf3 guards h2 and attacks the queen, so Black has to spend a move on it. g3 does the same job with a pawn. A move that ignores the threat loses at once.

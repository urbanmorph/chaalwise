card: strategy/finish-the-job/last-step
kind: move
prompt: Your pawn is one step from the last rank, where it becomes a queen. Only one move wins. Find it.
position: 8/kP6/2K5/8/8/8/8/8 w - - 0 1
measures: endgame
answers:
  - c6c7
hint: If you make a queen now, can Black's king take it?
explanation: Kc7 guards b8. Black's king must step back to a6, and the pawn queens next move. Queening at once lets Black's king take the new queen, and with nothing left, it is a draw.

card: reference/strategy/prophylaxis/stop-the-pin
kind: move
prompt: In this chess position, Black's bishop on c8 wants to go to g4 and pin your knight on f3 to the queen behind it. Which quiet move, one that attacks nothing, stops it before it starts?
position: 'moves: e4 e5 Nf3 Nc6 Bc4 Bc5 c3 Nf6 d3 d6 O-O O-O'
answers:
  - h2h3
hint: Take g4 away from the bishop.
explanation: "h3 guards g4, so the pin never happens. It does nothing on its own, and that is the point: the other side's best plan is gone."
measures: think-ahead

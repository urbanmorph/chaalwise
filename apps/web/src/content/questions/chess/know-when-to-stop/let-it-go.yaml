card: strategy/know-when-to-stop/let-it-go
kind: choice
prompt: "In this chess endgame, White's king walked over to guard the pawn on a5, and Black's king is coming for it. Black's h-pawn needs four moves to reach h1 and become a queen. Which move should White play?"
position: 8/1k6/8/P6p/2K5/8/8/8 w - - 0 1
arrows: [c4b5, c4d4]
options:
  - 'Kb5: keep guarding the pawn the king came for'
  - 'Kd4: let the a-pawn go and head for the h-pawn'
  - 'Kb4: guard the pawn from behind, out of the way'
answer: 1
feedback:
  - From b5 the king is six moves from h1, and the h-pawn needs only four. Black plays h4 and makes a new queen, and the a-pawn cannot save White.
  - ''
  - From b4 the king is still six moves from h1. Guarding from another square repeats the same mistake, and the h-pawn runs through.
highlight: [h1]
explanation: 'The moves spent walking to the a-pawn are gone either way. From d4 the king is four moves from h1, in time to take the h-pawn. Black wins the a-pawn, but the game is a draw. Kd3, Kd5, or pushing a6 first, also hold the draw.'

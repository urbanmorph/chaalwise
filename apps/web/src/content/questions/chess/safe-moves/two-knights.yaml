explanation: ...Bc5 lets Nxf7 win a pawn and attack the queen and the rook at once. Strong players answer with a risky counter-attack, ...Bxf2+, called the Traxler, giving up material to attack the king. At your level, defend f7 first with ...d5.
measures: safety

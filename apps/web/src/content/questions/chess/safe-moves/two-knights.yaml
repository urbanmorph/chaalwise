kind: choice
prompt: White's knight on g5 and bishop on c4 both attack f7. Is ...Bc5, bringing a bishop out, safe for Black?
position: 'moves: e4 e5 Nf3 Nc6 Bc4 Nf6 Ng5'
arrows: [g5f7, c4f7]
options:
  - Safe
  - Not safe
answer: 1
feedback:
  - It brings a piece out, but straight after it Nxf7 wins a pawn and attacks both the queen on d8 and the rook on h8.

kind: choice
prompt: Your group of four students has six weeks for a report worth 30% of the course mark. How do you plan the work?
options:
  - Agree one finished piece for each week, and check it together
  - Split the four parts, then join them up in week five
  - Do it all together in the last two weeks, when all are free

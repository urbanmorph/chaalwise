kind: choice
prompt: A client offers your design team a bonus to build a website in eight weeks, when such a job usually takes you ten. What do you do before you answer?
options:
  - Work out, week by week, what eight weeks would take from the team
  - Accept, since a bonus that size will pay for any overtime
  - Refuse, since a rushed job always ends badly
answer: 0
feedback:
  - ''
  - That is a guess, not a count. Overtime, other clients' work and tired people all cost something.
  - 'Not always: a shorter job can work with a plan. Refusing before you count is still choosing on a feeling.'
explanation: This is Count it through. Follow the offer to its end before you agree. Eight weeks needs 10 hours of overtime a week from each of five people, on top of a 40-hour week. At ₹400 an hour, that is ₹20,000 a week, or ₹1.6 lakh over eight weeks, more than the ₹1 lakh bonus.
measures: calculate

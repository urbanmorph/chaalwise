kind: choice
prompt: Several college societies each make one secret offer, a sealed bid, for the same hall on the same night, and the highest offer wins. Whoever wins sells tickets to the same crowd, and nobody knows how big it will be. You think the night is worth about ₹12,000, but you are unsure. What do you bid?
options:
  - Somewhat below ₹12,000, in case your guess is too high
  - ₹12,000, exactly what you think it is worth
  - Well above ₹12,000, since winning is what matters
answer: 0
feedback:
  - ''
  - Every society is guessing at the same crowd. If you win, it is likely because your guess was the highest, and so perhaps too high.
  - Winning by overpaying leaves less for everything else the night needs.
explanation: This is Don't overpay to win. When many bid on something worth the same to all of them but uncertain, the winner is often the one who guessed highest. Bid below your guess, so that winning does not mean you paid too much.
measures: value

kind: choice
prompt: Several college societies are making sealed bids for the same hall on the same night. You think it is worth about ₹12,000 to your society, but you are unsure. What do you bid?
options:
  - Somewhat below ₹12,000, in case your guess is too high
  - ₹12,000, exactly what you think it is worth
  - Well above ₹12,000, since winning is what matters
answer: 0
feedback:
  - ''
  - If you win, it is likely because your guess was higher than everyone else's, and so perhaps too high.
  - Winning by overpaying leaves less for everything else the night needs.
explanation: This is Don't overpay to win. When many bid on something uncertain, the winner is often the one who guessed highest. Bid below your guess, so that winning does not mean you paid too much.
measures: value

kind: choice
prompt: You run a small café, and your coffee roaster has just raised its price by 15%. Before you decide what to do about it, what is your first step?
options:
  - List several ways to answer it, then compare them
  - Find the cheapest roaster you can, and switch
  - Decide whether to accept the rise or refuse it
answer: 0
feedback:
  - ''
  - Price is one point, but a cheap roaster may be late or poor. You would be choosing on one option and one point.
